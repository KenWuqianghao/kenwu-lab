name: Release and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Archive on Zenodo and deploy the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Archive new result versions on Zenodo (mode ${{ vars.ZENODO_MODE || 'draft' }})
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_MODE: ${{ vars.ZENODO_MODE || 'draft' }}
        run: python3 tools/release.py --mode "$ZENODO_MODE"

      - name: Commit DOIs and tag the releases
        if: vars.ZENODO_MODE == 'publish'
        run: |
          [ -s released.txt ] || { echo "nothing released"; exit 0; }
          tags=$(cat released.txt); rm released.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Record Zenodo DOIs for $(echo $tags | tr '\n' ' ')"
          for t in $tags; do git tag "$t"; done
          git push origin HEAD:main
          git push origin $tags

      - name: Build the site
        run: |
          sudo apt-get install -y -qq pandoc
          python3 site/build.py

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
